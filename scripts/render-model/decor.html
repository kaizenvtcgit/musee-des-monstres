<script type="module">
// Renders the enclosure decorations (photo-scanned Poly Haven models or objects built here) in the game's
// isometric view, one still image per variant (driven by render-decor.mjs).
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// Output: W x H px; the centre of the tile, on the ground, at (W / 2, GROUND_Y). Shown at half size in the game.
const W = 128, H = 192, GROUND_Y = 150;
const SS = 2;
const PX_PER_UNIT = 64 / Math.SQRT1_2; // one tile = 1 unit = 128 px across (2:1 isometric)

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W * SS, H * SS);
renderer.setClearColor(0, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const hemi = new THREE.HemisphereLight(0xffffff, 0x6a6458, 1.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e0, 2.4);
sun.position.set(-4, 8, 3); // from the upper left, like the other renders
scene.add(sun);

// sky reflections (ice, water, glossy things)
const sky = (() => {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 32;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 32);
  grad.addColorStop(0, '#9ec9f0'); grad.addColorStop(0.5, '#eef5fb'); grad.addColorStop(1, '#6d7f6a');
  g.fillStyle = grad; g.fillRect(0, 0, 64, 32);
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return new THREE.PMREMGenerator(renderer).fromEquirectangular(t).texture;
})();
scene.environment = sky;
scene.environmentIntensity = 0.35;

const cam = new THREE.OrthographicCamera(
  -(W / 2) / PX_PER_UNIT, (W / 2) / PX_PER_UNIT, (H / 2) / PX_PER_UNIT, -(H / 2) / PX_PER_UNIT, 0.01, 100,
);
const el = THREE.MathUtils.degToRad(30), az = THREE.MathUtils.degToRad(45);
cam.position.set(Math.sin(az) * Math.cos(el) * 20, Math.sin(el) * 20, Math.cos(az) * Math.cos(el) * 20);
cam.lookAt(0, 0, 0);
cam.updateMatrixWorld();
cam.position.addScaledVector(new THREE.Vector3(0, 1, 0).applyQuaternion(cam.quaternion), (GROUND_Y - H / 2) / PX_PER_UNIT);

const holder = new THREE.Group();
scene.add(holder);

// ---- material tweaks ----------------------------------------------------------------------------

// Glowing lava in the dark creases of a rock texture (and a little at its foot).
function lavaGlow(mat, strength) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.lavaStrength = { value: strength };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying float vHeight;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvHeight = (modelMatrix * vec4(transformed, 1.0)).y;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform float lavaStrength;\nvarying float vHeight;')
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        #ifdef USE_MAP
          float lum = dot(sampledDiffuseColor.rgb, vec3(0.299, 0.587, 0.114));
          float crease = smoothstep(0.16, 0.04, lum); // only the darkest cracks
        #else
          float crease = 0.0;
        #endif
        float foot = clamp(1.0 - vHeight / 0.035, 0.0, 1.0);
        totalEmissiveRadiance += vec3(1.0, 0.32, 0.05) * (crease + foot * 0.8) * lavaStrength;`);
  };
}

// Snow on every surface facing the sky.
function snowCap(mat, amount) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.snowAmount = { value: amount };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying float vUp;')
      .replace('#include <beginnormal_vertex>', '#include <beginnormal_vertex>\nvUp = normalize(mat3(modelMatrix) * objectNormal).y;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform float snowAmount;\nvarying float vUp;')
      .replace('#include <map_fragment>', `#include <map_fragment>
        float snow = smoothstep(0.55 - snowAmount * 0.35, 0.8 - snowAmount * 0.3, vUp);
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.93, 0.96, 1.0), snow);`);
  };
}

// ---- objects built here -----------------------------------------------------------------------

let seed = 1;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

function crystals() {
  seed = 7;
  const g = new THREE.Group();
  const glass = new THREE.MeshStandardMaterial({
    color: 0x16131a, roughness: 0.08, metalness: 0.35, emissive: 0x200800, envMapIntensity: 1.4,
  });
  for (let i = 0; i < 7; i++) {
    const h = 0.25 + rnd() * 0.45, r = 0.05 + rnd() * 0.05;
    const shard = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 1.1, h, 6), glass);
    body.position.y = h / 2;
    const tip = new THREE.Mesh(new THREE.ConeGeometry(r, r * 2.2, 6), glass);
    tip.position.y = h + r * 1.1;
    shard.add(body, tip);
    const a = rnd() * Math.PI * 2, d = i === 0 ? 0 : 0.08 + rnd() * 0.14;
    shard.position.set(Math.cos(a) * d, 0, Math.sin(a) * d);
    shard.rotation.set((rnd() - 0.5) * 0.7, rnd() * 6, (rnd() - 0.5) * 0.7);
    g.add(shard);
  }
  // molten glow at the foot
  const pool = new THREE.Mesh(new THREE.CircleGeometry(0.26, 24), new THREE.MeshBasicMaterial({ color: 0xff7a26 }));
  pool.rotation.x = -Math.PI / 2;
  pool.position.y = 0.005;
  pool.userData.glow = true;
  g.add(pool);
  return g;
}

function reeds() {
  seed = 11;
  const g = new THREE.Group();
  const leaf = new THREE.MeshStandardMaterial({ color: 0x6f8a3a, roughness: 0.8, side: THREE.DoubleSide });
  const dry = new THREE.MeshStandardMaterial({ color: 0x9c8a52, roughness: 0.85, side: THREE.DoubleSide });
  const head = new THREE.MeshStandardMaterial({ color: 0x5a3a22, roughness: 0.9 });
  for (let i = 0; i < 34; i++) {
    const h = 0.35 + rnd() * 0.5;
    const blade = new THREE.Mesh(new THREE.ConeGeometry(0.012, h, 4), rnd() < 0.25 ? dry : leaf);
    const a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * 0.3;
    blade.position.set(Math.cos(a) * d, h / 2 - 0.02, Math.sin(a) * d);
    blade.rotation.set((rnd() - 0.5) * 0.35, 0, (rnd() - 0.5) * 0.35);
    g.add(blade);
    if (rnd() < 0.2) {
      const cat = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.09, 8), head);
      cat.position.set(0, h * 0.42, 0);
      blade.add(cat);
    }
  }
  return g;
}

function mushrooms() {
  seed = 5;
  const g = new THREE.Group();
  const stem = new THREE.MeshStandardMaterial({ color: 0xd9d4c8, roughness: 0.7 });
  const colors = [0x5fe0ff, 0x9a7dff, 0x5fe0ff, 0x7dffd0, 0x9a7dff, 0x5fe0ff];
  for (let i = 0; i < 6; i++) {
    const s = 0.5 + rnd() * 0.8;
    const m = new THREE.Group();
    const st = new THREE.Mesh(new THREE.CylinderGeometry(0.022 * s, 0.03 * s, 0.2 * s, 10), stem);
    st.position.y = 0.1 * s;
    const capMat = new THREE.MeshStandardMaterial({
      color: colors[i], emissive: colors[i], emissiveIntensity: 1.3, roughness: 0.4,
    });
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.08 * s, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), capMat);
    cap.scale.y = 0.6;
    cap.position.y = 0.2 * s;
    cap.userData.glow = true;
    m.add(st, cap);
    const a = rnd() * Math.PI * 2, d = i === 0 ? 0 : 0.08 + rnd() * 0.18;
    m.position.set(Math.cos(a) * d, 0, Math.sin(a) * d);
    m.rotation.set((rnd() - 0.5) * 0.3, 0, (rnd() - 0.5) * 0.3);
    g.add(m);
  }
  return g;
}

function iceBlock() {
  seed = 3;
  const geo = new THREE.IcosahedronGeometry(0.3, 1);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const k = 0.8 + rnd() * 0.35;
    p.setXYZ(i, p.getX(i) * k * 1.15, Math.max(0, p.getY(i) * k * 1.4 + 0.22), p.getZ(i) * k);
  }
  geo.computeVertexNormals();
  const ice = new THREE.MeshStandardMaterial({
    color: 0xbfe6f7, roughness: 0.06, metalness: 0.05, transparent: true, opacity: 0.82, envMapIntensity: 2,
    flatShading: true,
  });
  const block = new THREE.Mesh(geo, ice);
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.17, 0), new THREE.MeshStandardMaterial({ color: 0xf2fbff, roughness: 0.5 }));
  core.position.y = 0.24;
  core.scale.set(1.1, 1.3, 0.9);
  const g = new THREE.Group();
  g.add(core, block);
  return g;
}

function fir() {
  seed = 9;
  const g = new THREE.Group();
  const needles = new THREE.MeshStandardMaterial({ color: 0x1f3a26, roughness: 0.9, flatShading: true });
  const bark = new THREE.MeshStandardMaterial({ color: 0x4a3426, roughness: 1 });
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.05, 0.3, 8), bark);
  trunk.position.y = 0.15;
  g.add(trunk);
  const layers = 6;
  for (let i = 0; i < layers; i++) {
    const t = i / (layers - 1);
    const r = 0.3 * (1 - t * 0.8), h = 0.4 * (1 - t * 0.35);
    const geo = new THREE.ConeGeometry(r, h, 14, 2);
    const p = geo.attributes.position;
    for (let k = 0; k < p.count; k++) {
      const y = p.getY(k);
      if (y < h / 2 - 0.001) {
        const j = 1 + (rnd() - 0.5) * 0.35;
        p.setXYZ(k, p.getX(k) * j, y - rnd() * 0.04, p.getZ(k) * j);
      }
    }
    geo.computeVertexNormals();
    const cone = new THREE.Mesh(geo, needles);
    cone.position.y = 0.18 + t * 0.78 + h / 2;
    cone.rotation.y = rnd() * 6;
    g.add(cone);
  }
  return g;
}

// a cluster of crystals of any colour (amethyst, aquamarine), glowing at their foot
function crystalCluster(color, glow, seedN) {
  return () => {
    seed = seedN;
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.1, metalness: 0.2, emissive: glow, emissiveIntensity: 0.6, envMapIntensity: 1.4, flatShading: true });
    for (let i = 0; i < 8; i++) {
      const h = 0.2 + rnd() * 0.5, r = 0.04 + rnd() * 0.05;
      const shard = new THREE.Group();
      const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 1.15, h, 6), mat);
      body.position.y = h / 2;
      const tip = new THREE.Mesh(new THREE.ConeGeometry(r, r * 2.4, 6), mat);
      tip.position.y = h + r * 1.2;
      shard.add(body, tip);
      shard.traverse((m) => { if (m.isMesh) m.userData.glow = true; });
      const a = rnd() * Math.PI * 2, d = i === 0 ? 0 : 0.07 + rnd() * 0.16;
      shard.position.set(Math.cos(a) * d, 0, Math.sin(a) * d);
      shard.rotation.set((rnd() - 0.5) * 0.8, rnd() * 6, (rnd() - 0.5) * 0.8);
      g.add(shard);
    }
    return g;
  };
}

function stoneMat(color, rough = 0.95) {
  return new THREE.MeshStandardMaterial({ color, roughness: rough, flatShading: true });
}
// jitters the vertices of a geometry a little (weathered stone)
function weather(geo, amount, seedN) {
  seed = seedN;
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setXYZ(i, p.getX(i) + (rnd() - 0.5) * amount, p.getY(i) + (rnd() - 0.5) * amount, p.getZ(i) + (rnd() - 0.5) * amount);
  geo.computeVertexNormals();
  return geo;
}

function basaltColumns() {
  seed = 21;
  const g = new THREE.Group();
  const mat = stoneMat(0x2b2a2c, 0.85);
  const cols = [[0, 0, 0.8], [0.17, 0.05, 0.6], [-0.15, 0.08, 0.68], [0.05, -0.17, 0.5], [-0.08, -0.14, 0.42], [0.2, -0.13, 0.32], [-0.22, -0.06, 0.3]];
  for (const [x, z, h] of cols) {
    const c = new THREE.Mesh(weather(new THREE.CylinderGeometry(0.085, 0.09, h, 6, 3), 0.008, Math.floor(h * 100)), mat);
    c.position.set(x, h / 2, z);
    c.rotation.y = 0.3;
    g.add(c);
  }
  return g;
}

function coral() {
  seed = 31;
  const g = new THREE.Group();
  const colors = [0xe0785a, 0xd96b8a, 0xf0a35a];
  const branch = (parent, len, r, depth, color) => {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.7, r, len, 7), new THREE.MeshStandardMaterial({ color, roughness: 0.8 }));
    m.position.y = len / 2;
    const node = new THREE.Group();
    node.add(m);
    parent.add(node);
    if (depth > 0) {
      for (let i = 0; i < 2 + (rnd() < 0.5 ? 1 : 0); i++) {
        const child = new THREE.Group();
        child.position.y = len;
        child.rotation.set((rnd() - 0.5) * 1.2, rnd() * 6, (rnd() - 0.5) * 1.2);
        node.add(child);
        branch(child, len * 0.75, r * 0.7, depth - 1, color);
      }
    }
  };
  for (let k = 0; k < 3; k++) {
    const root = new THREE.Group();
    const a = rnd() * 6, d = k ? 0.12 + rnd() * 0.08 : 0;
    root.position.set(Math.cos(a) * d, 0, Math.sin(a) * d);
    g.add(root);
    branch(root, 0.13 + rnd() * 0.05, 0.035, 3, colors[k]);
  }
  return g;
}

function anemones() {
  seed = 41;
  const g = new THREE.Group();
  for (let k = 0; k < 4; k++) {
    const col = [0xf27fa0, 0xffb36b, 0xb48cff, 0x7fe0c0][k];
    const a = new THREE.Group();
    const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.06, 10), new THREE.MeshStandardMaterial({ color: 0x8a5a4a, roughness: 0.8 }));
    foot.position.y = 0.03;
    a.add(foot);
    const tm = new THREE.MeshStandardMaterial({ color: col, roughness: 0.6, emissive: col, emissiveIntensity: 0.15 });
    for (let i = 0; i < 14; i++) {
      const t = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.008, 0.09, 4), tm);
      const ang = (i / 14) * Math.PI * 2;
      t.position.set(Math.cos(ang) * 0.03, 0.1, Math.sin(ang) * 0.03);
      t.rotation.set(Math.sin(ang) * 0.6, 0, -Math.cos(ang) * 0.6);
      a.add(t);
    }
    const ang = rnd() * 6, d = k ? 0.1 + rnd() * 0.12 : 0;
    a.position.set(Math.cos(ang) * d, 0, Math.sin(ang) * d);
    a.scale.setScalar(0.8 + rnd() * 0.6);
    g.add(a);
  }
  return g;
}

function jellyfish() {
  seed = 51;
  const g = new THREE.Group();
  for (let k = 0; k < 3; k++) {
    const col = [0x8fd8ff, 0xc29bff, 0x8fffe0][k];
    const mat = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 1.1, transparent: true, opacity: 0.75, roughness: 0.3 });
    const j = new THREE.Group();
    const bell = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), mat);
    bell.scale.y = 0.8;
    bell.userData.glow = true;
    j.add(bell);
    for (let i = 0; i < 6; i++) {
      const t = new THREE.Mesh(new THREE.CylinderGeometry(0.003, 0.002, 0.14, 3), mat);
      const ang = (i / 6) * Math.PI * 2;
      t.position.set(Math.cos(ang) * 0.04, -0.07, Math.sin(ang) * 0.04);
      j.add(t);
    }
    const ang = rnd() * 6, d = k ? 0.12 + rnd() * 0.1 : 0;
    j.position.set(Math.cos(ang) * d, 0.2 + rnd() * 0.25, Math.sin(ang) * d);
    j.rotation.set((rnd() - 0.5) * 0.4, 0, (rnd() - 0.5) * 0.4);
    g.add(j);
  }
  return g;
}

function vent() {
  seed = 61;
  const g = new THREE.Group();
  const rock = stoneMat(0x2e2a28);
  for (let k = 0; k < 3; k++) {
    const h = [0.5, 0.32, 0.22][k];
    const c = new THREE.Mesh(weather(new THREE.CylinderGeometry(0.035, 0.09, h, 9, 4), 0.02, 70 + k), rock);
    const a = k * 2.2, d = k ? 0.14 : 0;
    c.position.set(Math.cos(a) * d, h / 2, Math.sin(a) * d);
    g.add(c);
    const glow = new THREE.Mesh(new THREE.CircleGeometry(0.03, 12), new THREE.MeshBasicMaterial({ color: 0xff7a30 }));
    glow.rotation.x = -Math.PI / 2;
    glow.position.set(c.position.x, h + 0.001, c.position.z);
    glow.userData.glow = true;
    g.add(glow);
  }
  return g;
}

function wisps() {
  seed = 71;
  const g = new THREE.Group();
  for (let k = 0; k < 4; k++) {
    const col = k % 2 ? 0x9dffb0 : 0xc8ff8a;
    const orb = new THREE.Mesh(new THREE.SphereGeometry(0.03 + rnd() * 0.02, 12, 8), new THREE.MeshBasicMaterial({ color: col }));
    orb.userData.glow = true;
    const a = rnd() * 6, d = k ? 0.08 + rnd() * 0.15 : 0;
    orb.position.set(Math.cos(a) * d, 0.18 + rnd() * 0.3, Math.sin(a) * d);
    g.add(orb);
  }
  // a hint of reeds below
  const leaf = new THREE.MeshStandardMaterial({ color: 0x4f5a2a, roughness: 0.9, side: THREE.DoubleSide });
  for (let i = 0; i < 10; i++) {
    const h = 0.12 + rnd() * 0.15;
    const b = new THREE.Mesh(new THREE.ConeGeometry(0.008, h, 4), leaf);
    const a = rnd() * 6, d = Math.sqrt(rnd()) * 0.22;
    b.position.set(Math.cos(a) * d, h / 2, Math.sin(a) * d);
    g.add(b);
  }
  return g;
}

function tombstone() {
  seed = 81;
  const g = new THREE.Group();
  const mat = stoneMat(0x8b8a86);
  const slab = new THREE.Mesh(weather(new THREE.BoxGeometry(0.3, 0.38, 0.08, 4, 4, 2), 0.01, 82), mat);
  slab.position.y = 0.19;
  const top = new THREE.Mesh(weather(new THREE.CylinderGeometry(0.15, 0.15, 0.08, 16, 1, false, 0, Math.PI), 0.008, 83), mat);
  top.rotation.set(Math.PI / 2, 0, Math.PI / 2);
  top.position.y = 0.38;
  const mound = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 6, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x5a4632, roughness: 1 }));
  mound.scale.set(0.8, 0.18, 1.4);
  mound.position.z = 0.2;
  g.add(slab, top, mound);
  g.rotation.z = 0.06;
  return g;
}

function stoneCross() {
  const g = new THREE.Group();
  const mat = stoneMat(0x95938c);
  const v = new THREE.Mesh(weather(new THREE.BoxGeometry(0.09, 0.62, 0.08, 2, 6, 2), 0.008, 91), mat);
  v.position.y = 0.31;
  const h = new THREE.Mesh(weather(new THREE.BoxGeometry(0.34, 0.08, 0.08, 4, 2, 2), 0.008, 92), mat);
  h.position.y = 0.44;
  const base = new THREE.Mesh(weather(new THREE.BoxGeometry(0.22, 0.08, 0.2, 2, 2, 2), 0.01, 93), mat);
  base.position.y = 0.04;
  g.add(v, h, base);
  g.rotation.set(0.04, 0, -0.08);
  return g;
}

function brokenColumn() {
  seed = 101;
  const g = new THREE.Group();
  const mat = stoneMat(0xc9c2b0, 0.9);
  const shaft = new THREE.Mesh(weather(new THREE.CylinderGeometry(0.11, 0.12, 0.62, 16, 6), 0.012, 102), mat);
  shaft.position.y = 0.31 + 0.06;
  const base = new THREE.Mesh(weather(new THREE.BoxGeometry(0.3, 0.06, 0.3, 2, 1, 2), 0.01, 103), mat);
  base.position.y = 0.03;
  const drum = new THREE.Mesh(weather(new THREE.CylinderGeometry(0.11, 0.11, 0.22, 16, 2), 0.015, 104), mat);
  drum.rotation.set(Math.PI / 2, 0, 0.4);
  drum.position.set(0.25, 0.11, 0.12);
  g.add(shaft, base, drum);
  return g;
}

function stalagmites() {
  seed = 111;
  const g = new THREE.Group();
  const mat = stoneMat(0x6c6676, 0.8);
  for (let k = 0; k < 5; k++) {
    const h = 0.2 + rnd() * 0.5;
    const c = new THREE.Mesh(weather(new THREE.ConeGeometry(0.05 + h * 0.12, h, 9, 4), 0.012, 112 + k), mat);
    const a = rnd() * 6, d = k ? 0.08 + rnd() * 0.15 : 0;
    c.position.set(Math.cos(a) * d, h / 2, Math.sin(a) * d);
    g.add(c);
  }
  return g;
}

function cairn() {
  seed = 121;
  const g = new THREE.Group();
  let y = 0;
  for (let k = 0; k < 5; k++) {
    const w = 0.24 - k * 0.035, h = 0.07 + rnd() * 0.03;
    const st = new THREE.Mesh(weather(new THREE.SphereGeometry(w, 10, 6), 0.02, 122 + k), stoneMat([0x7c776f, 0x8d877d, 0x6f6a63][k % 3]));
    st.scale.set(1, h / w, 0.85);
    st.position.set((rnd() - 0.5) * 0.04, y + h, (rnd() - 0.5) * 0.04);
    st.rotation.y = rnd() * 6;
    y += h * 1.8;
    g.add(st);
  }
  return g;
}

function iceSpikes() {
  seed = 131;
  const g = new THREE.Group();
  const ice = new THREE.MeshStandardMaterial({ color: 0xbfe6f7, roughness: 0.05, transparent: true, opacity: 0.85, envMapIntensity: 2, flatShading: true });
  for (let k = 0; k < 6; k++) {
    const h = 0.25 + rnd() * 0.55;
    const c = new THREE.Mesh(new THREE.ConeGeometry(0.04 + rnd() * 0.05, h, 5), ice);
    const a = rnd() * 6, d = k ? 0.08 + rnd() * 0.15 : 0;
    c.position.set(Math.cos(a) * d, h / 2, Math.sin(a) * d);
    c.rotation.set((rnd() - 0.5) * 0.5, rnd() * 6, (rnd() - 0.5) * 0.5);
    g.add(c);
  }
  return g;
}

function flag() {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.015, 0.95, 8), new THREE.MeshStandardMaterial({ color: 0x6b5236, roughness: 0.8 }));
  pole.position.y = 0.47;
  const cloth = new THREE.Mesh(new THREE.PlaneGeometry(0.32, 0.2, 8, 2), new THREE.MeshStandardMaterial({ color: 0xc8402e, roughness: 0.8, side: THREE.DoubleSide }));
  const p = cloth.geometry.attributes.position;
  for (let i = 0; i < p.count; i++) p.setZ(i, Math.sin((p.getX(i) + 0.16) * 14) * 0.025);
  cloth.geometry.computeVertexNormals();
  cloth.position.set(0.17, 0.82, 0);
  const rocks = new THREE.Mesh(weather(new THREE.SphereGeometry(0.12, 10, 6), 0.03, 141), stoneMat(0x77736c));
  rocks.scale.y = 0.45;
  rocks.position.y = 0.03;
  g.add(pole, cloth, rocks);
  return g;
}

const BUILT = {
  crystals, reeds, mushrooms, iceBlock, fir, basaltColumns, coral, anemones, jellyfish, vent, wisps, tombstone,
  stoneCross, brokenColumn, stalagmites, cairn, iceSpikes, flag,
  amethyst: crystalCluster(0x8e5fd6, 0x5a2a9a, 151), aquamarine: crystalCluster(0x6fd6e6, 0x2a8a9a, 161),
};

// ---- loading and placing ----------------------------------------------------------------------

const loader = new GLTFLoader();

// opts: { model: url | built: name, size (max footprint in tiles) | height (in tiles), tint, lava, snow, glow,
//         waterline (tiles above the bottom that are under water) }
async function build(opts) {
  let obj;
  if (opts.built) obj = BUILT[opts.built]();
  else obj = (await loader.loadAsync(opts.model)).scene;
  if (opts.largest) {
    obj.updateMatrixWorld(true);
    const meshes = [];
    obj.traverse((m) => { if (m.isMesh) meshes.push(m); });
    const vol = (m) => { const s = new THREE.Box3().setFromObject(m).getSize(new THREE.Vector3()); return s.x * s.y * s.z; };
    meshes.sort((a, b) => vol(b) - vol(a)).slice(opts.largest).forEach((m) => m.removeFromParent());
  }
  if (opts.light) {
    // lit from inside: the parts whose material name contains `lightOn` (a lantern's glass) glow warmly
    obj.traverse((m) => {
      if (!m.isMesh || !m.material.name.includes(opts.lightOn)) return;
      m.material = m.material.clone();
      m.material.emissive = new THREE.Color(opts.light);
      m.material.emissiveIntensity = 1.4;
      m.material.opacity = Math.max(m.material.opacity, 0.85);
      m.userData.glow = true;
    });
  }
  // normalise: centred on the tile, resting on the ground, scaled to the wanted size
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const k = opts.height ? opts.height / size.y : (opts.size ?? 0.8) / Math.max(size.x, size.z);
  const wrap = new THREE.Group();
  obj.position.sub(new THREE.Vector3((box.min.x + box.max.x) / 2, box.min.y, (box.min.z + box.max.z) / 2));
  wrap.add(obj);
  wrap.scale.setScalar(k);
  obj.traverse((m) => {
    if (!m.isMesh) return;
    m.material = m.material.clone();
    if (opts.tint) m.material.color.multiply(new THREE.Color(opts.tint));
    if (opts.lava) lavaGlow(m.material, opts.lava);
    if (opts.snow) snowCap(m.material, opts.snow);
  });
  return wrap;
}

const out = document.createElement('canvas');
const tmp = document.createElement('canvas');
const glowC = document.createElement('canvas');

function renderTo(ctx) {
  renderer.render(scene, cam);
  ctx.drawImage(renderer.domElement, 0, 0, W, H);
}

// Glow around the emissive parts: render them alone, blur, add on top.
function addGlow(ctx, obj, strength) {
  const saved = [];
  obj.traverse((m) => {
    if (!m.isMesh) return;
    saved.push([m, m.material]);
    const lit = m.userData.glow || (m.material.emissive && m.material.emissive.getHex() && m.material.emissiveIntensity > 0.5);
    // only the glowing parts are drawn, so the light shines through the frame of a lantern
    m.material = new THREE.MeshBasicMaterial({ color: lit ? (m.material.emissive?.getHex() || m.material.color.getHex()) : 0, visible: !!lit });
  });
  const env = scene.environment;
  scene.environment = null;
  renderer.render(scene, cam);
  scene.environment = env;
  saved.forEach(([m, mat]) => { m.material.dispose(); m.material = mat; });
  glowC.width = W; glowC.height = H;
  const g = glowC.getContext('2d', { willReadFrequently: true });
  g.drawImage(renderer.domElement, 0, 0, W, H);
  const img = g.getImageData(0, 0, W, H);
  for (let i = 0; i < img.data.length; i += 4) img.data[i + 3] = Math.max(img.data[i], img.data[i + 1], img.data[i + 2]);
  g.putImageData(img, 0, 0);
  tmp.width = W; tmp.height = H;
  const t = tmp.getContext('2d');
  t.filter = 'blur(5px)';
  t.drawImage(glowC, 0, 0);
  t.filter = 'none';
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = strength;
  ctx.drawImage(tmp, 0, 0);
  ctx.restore();
}

// Renders one decoration turned by `turn` degrees; returns a PNG data URL.
window.renderDecor = async (opts, turn) => {
  holder.clear();
  const obj = await build(opts);
  obj.rotation.y = THREE.MathUtils.degToRad(turn);
  holder.add(obj);
  holder.updateMatrixWorld(true);
  out.width = W; out.height = H;
  const ctx = out.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  if (opts.waterline !== undefined) {
    // the object sits lower, its waterline at the ground of the tile; under the surface it is faint and
    // tinted like the water, above it is drawn normally
    holder.position.y = -opts.waterline;
    holder.updateMatrixWorld(true);
    renderer.clippingPlanes = [new THREE.Plane(new THREE.Vector3(0, -1, 0), 0)];
    tmp.width = W; tmp.height = H;
    const t = tmp.getContext('2d');
    renderTo(t);
    t.globalCompositeOperation = 'source-atop';
    t.fillStyle = 'rgba(20, 90, 105, 0.55)';
    t.fillRect(0, 0, W, H);
    ctx.globalAlpha = 0.5;
    ctx.drawImage(tmp, 0, 0);
    ctx.globalAlpha = 1;
    renderer.clippingPlanes = [new THREE.Plane(new THREE.Vector3(0, 1, 0), 0)];
    renderTo(ctx);
    renderer.clippingPlanes = [];
    holder.position.y = 0;
  } else {
    renderTo(ctx);
  }
  if (opts.glow) addGlow(ctx, obj, opts.glow);
  return out.toDataURL('image/png');
};
// Packs images (data URLs, all the same size) into one sheet, `cols` per row.
window.packAtlas = async (urls, cols, format = 'image/webp', quality = 0.86) => {
  const imgs = await Promise.all(urls.map((u) => new Promise((ok) => { const im = new Image(); im.onload = () => ok(im); im.src = u; })));
  const c = document.createElement('canvas');
  c.width = W * cols;
  c.height = H * Math.ceil(imgs.length / cols);
  const g = c.getContext('2d');
  imgs.forEach((im, i) => g.drawImage(im, (i % cols) * W, Math.floor(i / cols) * H));
  return c.toDataURL(format, quality);
};
window.ready = true;
</script>
