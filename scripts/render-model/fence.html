<!doctype html>
<html>
<body style="margin:0">
<script type="importmap">
  { "imports": { "three": "/three/build/three.module.js" } }
</script>
<script type="module">
// Builds the enclosure barrier in 3D (stone wall, stone pillars, iron bars with spikes) and renders
// one segment per tile-edge direction, in the game's isometric view (driven by render-fence.mjs).
import * as THREE from 'three';

// Output: W x H px, the middle of the tile edge (on the ground) at (W / 2, GROUND_Y).
// The game shows it at half size (see FENCE_IMG in GameScene.js).
const W = 128, H = 192, GROUND_Y = 134;
const SS = 2; // supersampling
const PX_PER_UNIT = 64 / Math.SQRT1_2; // one tile = 64 px across in the 2x image (2:1 isometric)

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W * SS, H * SS);
renderer.setClearColor(0, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x6a6458, 1.9));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.6);
sun.position.set(-4, 8, 3); // light from the upper left, like the other renders
scene.add(sun);

// --- materials ---
function stoneTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#5d5a55';
  g.fillRect(0, 0, 256, 64);
  const rows = 2, h = 64 / rows;
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let r = 0; r < rows; r++) {
    let x = r % 2 ? -24 : 0;
    while (x < 256) {
      const w = 40 + rnd() * 24;
      const v = 128 + Math.floor(rnd() * 34);
      g.fillStyle = `rgb(${v},${v - 4},${v - 12})`;
      g.fillRect(x + 2, r * h + 2, w - 4, h - 4);
      x += w;
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const stoneTex = stoneTexture();
const wallMat = new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 0.95 });
const pillarTex = stoneTex.clone();
pillarTex.repeat.set(0.35, 3);
pillarTex.needsUpdate = true;
const pillarMat = new THREE.MeshStandardMaterial({ map: pillarTex, roughness: 0.95 });
const capMat = new THREE.MeshStandardMaterial({ color: 0x9a968d, roughness: 0.9 });
const ironMat = new THREE.MeshStandardMaterial({ color: 0x33373d, metalness: 0.6, roughness: 0.45 });
const glassMat = new THREE.MeshStandardMaterial({
  color: 0xbfe3f2, transparent: true, opacity: 0.3, roughness: 0.05, metalness: 0.1, depthWrite: false,
});
const glareMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, depthWrite: false, side: THREE.DoubleSide });
const frameMat = new THREE.MeshStandardMaterial({ color: 0x3b4148, metalness: 0.5, roughness: 0.5 });
const rivetMat = new THREE.MeshStandardMaterial({ color: 0x8a6a2a, metalness: 0.7, roughness: 0.4 });

// --- one segment along +X, from x = -0.5 to x = +0.5, centred on the tile edge ---
const WALL_H = 0.28, WALL_D = 0.2, TOP = 1.15, PILLAR = 0.24;
function buildSegment(kind) {
  const seg = new THREE.Group();
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); seg.add(m); return m; };
  // low stone wall
  add(new THREE.BoxGeometry(1, WALL_H, WALL_D), wallMat, 0, WALL_H / 2, 0);
  add(new THREE.BoxGeometry(1, 0.05, WALL_D + 0.06), capMat, 0, WALL_H + 0.025, 0);
  // stone pillars at both ends, with a cap
  for (const x of [-0.5, 0.5]) {
    add(new THREE.BoxGeometry(PILLAR, TOP + 0.05, PILLAR), pillarMat, x, (TOP + 0.05) / 2, 0);
    add(new THREE.BoxGeometry(PILLAR + 0.07, 0.07, PILLAR + 0.07), capMat, x, TOP + 0.085, 0);
    add(new THREE.ConeGeometry(0.11, 0.12, 4), capMat, x, TOP + 0.18, 0).rotation.y = Math.PI / 4;
  }
  if (kind === 'window') {
    // zoo viewing window: one big glass pane in a metal frame, with two light reflections
    const span = 1 - PILLAR, bottom = WALL_H + 0.05, top = TOP - 0.02, h = top - bottom;
    add(new THREE.BoxGeometry(span, h, 0.03), glassMat, 0, bottom + h / 2, 0);
    for (const [x, w] of [[-0.12, 0.09], [0.02, 0.035]]) {
      const g = add(new THREE.PlaneGeometry(w, h * 0.85), glareMat, x, bottom + h / 2, 0.02);
      g.rotation.z = -0.35;
    }
    add(new THREE.BoxGeometry(span, 0.05, 0.07), frameMat, 0, top, 0);
    add(new THREE.BoxGeometry(span, 0.04, 0.07), frameMat, 0, bottom, 0);
    return seg;
  }
  // iron bars with spear tips
  const n = 6, span = 1 - PILLAR;
  for (let i = 0; i < n; i++) {
    const x = -span / 2 + (span * (i + 0.5)) / n;
    add(new THREE.CylinderGeometry(0.022, 0.022, TOP - WALL_H - 0.02, 8), ironMat, x, (TOP + WALL_H) / 2 - 0.01, 0);
    add(new THREE.ConeGeometry(0.045, 0.12, 8), ironMat, x, TOP + 0.04, 0);
  }
  // two thick horizontal rails with rivets
  for (const y of [WALL_H + 0.3, TOP - 0.12]) {
    add(new THREE.BoxGeometry(span, 0.07, 0.06), ironMat, 0, y, 0);
    for (let i = 0; i < n; i++) {
      add(new THREE.SphereGeometry(0.022, 8, 6), rivetMat, -span / 2 + (span * (i + 0.5)) / n, y, 0.035);
    }
  }
  return seg;
}
const pivot = new THREE.Group();
scene.add(pivot);
const segments = { bars: buildSegment('bars'), window: buildSegment('window') };

// Isometric camera: 30 deg down, 45 deg around, so a tile is a 2:1 diamond.
const cam = new THREE.OrthographicCamera(
  -(W / 2) / PX_PER_UNIT, (W / 2) / PX_PER_UNIT, (H / 2) / PX_PER_UNIT, -(H / 2) / PX_PER_UNIT, 0.01, 100,
);
const el = THREE.MathUtils.degToRad(30), az = THREE.MathUtils.degToRad(45);
cam.position.set(Math.sin(az) * Math.cos(el) * 20, Math.sin(el) * 20, Math.cos(az) * Math.cos(el) * 20);
cam.lookAt(0, 0, 0);
cam.updateMatrixWorld();
// move the view so the world origin lands at (W / 2, GROUND_Y)
const up = new THREE.Vector3(0, 1, 0).applyQuaternion(cam.quaternion);
cam.position.addScaledVector(up, (GROUND_Y - H / 2) / PX_PER_UNIT);

const out = document.createElement('canvas');
out.width = W; out.height = H;
const ctx = out.getContext('2d');
ctx.imageSmoothingQuality = 'high';

// axis 'X': the segment runs along tile +x (screen down-right); 'Y': along tile +y (screen down-left).
// The camera looks from +X+Z (world), so world +X shows down-right and world +Z down-left.
window.renderFence = (axis, kind = 'bars') => {
  pivot.clear();
  pivot.add(segments[kind]);
  pivot.rotation.y = axis === 'X' ? 0 : -Math.PI / 2;
  renderer.render(scene, cam);
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(renderer.domElement, 0, 0, W, H);
  return out.toDataURL('image/png');
};
window.ready = true;
</script>
</body>
</html>
